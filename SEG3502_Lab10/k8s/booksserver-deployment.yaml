apiVersion: v1
kind: Service
metadata:
  name: booksserver
spec:
  selector:
    app: booksserver
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booksserver
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: booksserver
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: booksserver
        image: books-rest-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: MYSQL_DB
          value: booksDb
        - name: MYSQL_HOST
          value: mysql
        - name: MYSQL_PASSWORD
          value: root
        - name: MYSQL_USER
          value: root
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
      initContainers:
      - name: wait-for-mysql
        image: mysql:8
        command:
        - sh
        - -c
        - until mysql -h mysql -uroot -proot -e "SELECT 1" booksDb; do sleep 3; done
