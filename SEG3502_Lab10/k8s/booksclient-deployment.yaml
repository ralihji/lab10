apiVersion: v1
kind: Service
metadata:
  name: booksapp
spec:
  selector:
    app: booksapp
  ports:
  - port: 4100
    targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booksapp
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: booksapp
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: booksapp
        image: books-api-client:latest
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: http://localhost:8080/books-api/
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
